services:
  mysql:
    image: mysql:8.0
    container_name: synpharm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: synpharm_root
      MYSQL_DATABASE: synpharm
      MYSQL_USER: synpharm
      MYSQL_PASSWORD: synpharm_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./synpharm-backend/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - synpharm-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: synpharm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - synpharm-network
    restart: unless-stopped

  backend:
    build: 
      context: ./synpharm-backend
      dockerfile: Dockerfile
    container_name: synpharm-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: synpharm
      MYSQL_USERNAME: synpharm
      MYSQL_PASSWORD: synpharm_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FASTAPI_URL: http://fastapi:8000
      JWT_SECRET: SynPharmSecretKey2024ForJWTTokenGeneration
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_results:/app/results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/auth/captcha/send"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - synpharm-network
    restart: unless-stopped

  fastapi:
    build: 
      context: ./synpharm-fastapi
      dockerfile: Dockerfile
    container_name: synpharm-fastapi
    ports:
      - "8000:8000"
    environment:
      DEVICE: cpu
      BATCH_SIZE: 50
    volumes:
      - ./synpharm-fastapi/models:/app/models
      - fastapi_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - synpharm-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_results:
    driver: local
  fastapi_logs:
    driver: local

networks:
  synpharm-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16