# =============================================================================
# SynPharm 服务编排（企业级）
#
# 使用方式：
#   cd deploy
#   cp .env.example .env        # 首次：复制模板并修改密码/密钥
#   docker compose up -d --build
#
# 所有敏感配置（密码、JWT 密钥等）一律从 .env 读取，严禁硬编码。
# =============================================================================

name: synpharm

services:
  # ---------------------------------------------------------------------------
  # MySQL 8.0（数据库）
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: synpharm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-synpharm}
      MYSQL_USER: ${MYSQL_USER:-synpharm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次初始化自动执行 sql/ 下的建表脚本
      - ../synpharm-backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - synpharm
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis 7（缓存 / 验证码 / Token 黑名单）
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: synpharm-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - synpharm
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # RabbitMQ 3.13（消息队列：批量任务异步调度）
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: synpharm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-synpharm}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}
    ports:
      # 管理台仅限内网/本机访问，生产不暴露公网
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - synpharm
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # SpringBoot 后端（业务 API）
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../synpharm-backend
    image: synpharm/backend:${SYNPHARM_VERSION:-1.0.0}
    container_name: synpharm-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # 数据库（对应 application-docker.yml 中的 ${DB_*}）
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-synpharm}
      DB_USERNAME: ${MYSQL_USER:-synpharm}
      DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # RabbitMQ（批量任务消息队列）
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-synpharm}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      # 验证码开发模式（true 时验证码回显，仅限本地测试；生产必须 false）
      CAPTCHA_DEV_MODE: ${CAPTCHA_DEV_MODE:-false}
      # FastAPI 算法引擎
      FASTAPI_URL: http://fastapi:8000
      # 后端调用算法引擎使用的单一 API Key（与 FastAPI 的 API_KEYS 对应）
      FASTAPI_API_KEY: ${FASTAPI_API_KEY:-}
      # QQ 邮箱（可选，用于发送验证码）
      QQ_EMAIL: ${QQ_EMAIL:-}
      QQ_EMAIL_AUTH_CODE: ${QQ_EMAIL_AUTH_CODE:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_results:/app/results
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - synpharm
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # FastAPI 算法引擎（AI 预测）
  # ---------------------------------------------------------------------------
  fastapi:
    build:
      context: ../synpharm-fastapi
    image: synpharm/fastapi:${SYNPHARM_VERSION:-1.0.0}
    container_name: synpharm-fastapi
    environment:
      MODEL_DIR: /app/models
      DEVICE: ${FASTAPI_DEVICE:-cpu}
      BATCH_SIZE: ${FASTAPI_BATCH_SIZE:-50}
      # FastAPI 接受的 API Key 列表（逗号分隔）；留空则回退到后端使用的单一 Key；两者都空则关闭认证（仅限内网）
      API_KEYS: ${FASTAPI_API_KEYS:-${FASTAPI_API_KEY:-}}
      LOG_LEVEL: ${FASTAPI_LOG_LEVEL:-INFO}
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    volumes:
      # 模型文件（不进镜像，统一挂载）
      - ../synpharm-fastapi/models:/app/models:ro
      - fastapi_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - synpharm
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 前端（Nginx 静态资源 + /api 反代到后端）
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../synpharm-frontend
    image: synpharm/frontend:${SYNPHARM_VERSION:-1.0.0}
    container_name: synpharm-frontend
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      - backend
    volumes:
      # 部署时可覆盖 nginx 配置（镜像内已有默认配置）
      - ../synpharm-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - synpharm
    restart: unless-stopped

# -----------------------------------------------------------------------------
# 网络与数据卷
# -----------------------------------------------------------------------------
networks:
  synpharm:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  backend_uploads:
  backend_results:
  fastapi_logs:
