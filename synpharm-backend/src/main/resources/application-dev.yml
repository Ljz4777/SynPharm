spring:
  application:
    name: synpharm-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/synpharm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: localhost
      port: 6379
#      password:
      database: 0
      timeout: 3000ms

  # 邮件配置（QQ邮箱发送验证码）
  # 部署时通过环境变量 QQ_EMAIL 和 QQ_EMAIL_AUTH_CODE 注入真实值
  mail:
    host: smtp.qq.com
    port: 465
    username: ${QQ_EMAIL:}
    password: ${QQ_EMAIL_AUTH_CODE:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.synpharm.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 本地开发默认密钥（仅用于本机调试；部署环境必须通过 JWT_SECRET 环境变量注入强随机密钥）
  secret: ${JWT_SECRET:SynPharm-Dev-Secret-Key-2026-Do-Not-Use-In-Production-Env-1234567890}
  expiration: 86400000

server:
  port: 8080

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.synpharm: debug
    com.baomidou.mybatisplus: info

# 应用配置
app:
  name: SynPharm
  doc:
    open: true
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
