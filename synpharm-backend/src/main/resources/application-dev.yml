spring:
  application:
    name: synpharm-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/synpharm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: password

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms

  # 邮件配置（QQ邮箱发送验证码）
  # 部署时通过环境变量 QQ_EMAIL 和 QQ_EMAIL_AUTH_CODE 注入真实值
  mail:
    host: smtp.qq.com
    port: 465
    username: ${QQ_EMAIL:noreply@synpharm.com}
    password: ${QQ_EMAIL_AUTH_CODE:your-auth-code}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.synpharm.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

server:
  port: 8080

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.synpharm: debug
    com.baomidou.mybatisplus: info

# 应用配置
app:
  name: SynPharm
