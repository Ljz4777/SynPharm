spring:
  application:
    name: synpharm-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:synpharm}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:synpharm}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:synpharm}
    password: ${RABBITMQ_PASSWORD:}

  mail:
    host: smtp.qq.com
    port: 465
    username: ${QQ_EMAIL:}
    password: ${QQ_EMAIL_AUTH_CODE:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.synpharm.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 安全关键：必须在环境变量中提供强随机密钥（>=32字节），未提供则启动即失败（fail-fast）
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # 邮箱为可选功能（未配置 QQ_EMAIL 时不影响服务健康，避免 SMTP 认证失败拖垮健康检查）
    mail:
      enabled: false

knife4j:
  enable: false
  setting:
    language: zh_cn

logging:
  level:
    com.synpharm: info
    com.baomidou.mybatisplus: info

file:
  upload-dir: /app/uploads
  result-dir: /app/results

fastapi:
  base-url: ${FASTAPI_URL:http://fastapi:8000}
  # 调用算法引擎的 API Key（与 FASTAPI_API_KEYS 对应；留空则不携带）
  api-key: ${FASTAPI_API_KEY:}
  timeout-single: ${FASTAPI_TIMEOUT_SINGLE:30000}
  timeout-batch: ${FASTAPI_TIMEOUT_BATCH:60000}

app:
  name: SynPharm
  # 生产关闭匿名文档访问；前端经 nginx 同源反代，无需 CORS
  doc:
    open: false
  cors:
    allowed-origins: