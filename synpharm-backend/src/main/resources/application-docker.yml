spring:
  application:
    name: synpharm-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/synpharm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:synpharm}
    password: ${MYSQL_PASSWORD:synpharm_pass}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms

  mail:
    host: smtp.qq.com
    port: 465
    username: ${QQ_EMAIL:noreply@synpharm.com}
    password: ${QQ_EMAIL_AUTH_CODE:your-auth-code}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.synpharm.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:SynPharmSecretKey2024ForJWTTokenGeneration}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: 8080

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.synpharm: debug
    com.baomidou.mybatisplus: info

file:
  upload-dir: /app/uploads
  result-dir: /app/results

fastapi:
  base-url: ${FASTAPI_URL:http://fastapi:8000}
  timeout-single: ${FASTAPI_TIMEOUT_SINGLE:30000}
  timeout-batch: ${FASTAPI_TIMEOUT_BATCH:60000}

app:
  name: SynPharm