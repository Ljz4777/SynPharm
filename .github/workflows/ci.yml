name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: 后端构建与单测
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synpharm-backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 运行单元测试
        run: mvn -B test

  frontend:
    name: 前端类型检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synpharm-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: vue-tsc 类型检查
        run: npx vue-tsc --noEmit
